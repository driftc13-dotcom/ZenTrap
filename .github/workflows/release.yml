name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'zentrap-npm-ci.log'
          npm ci --no-audit --no-fund --fetch-retries=5 --fetch-timeout=120000 --verbose *> $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $tail = @(Get-Content $logPath -Tail 25 | ForEach-Object { $_ -replace '(?i)(authorization:|token=|password=)\s*\S+', '$1 [redacted]' })
            Write-Host "::error title=npm-ci-failed::$($tail -join '%0A')"
            exit $exitCode
          }
          Get-Content $logPath -Tail 15
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Run tests
        run: npm test
      - name: Build and publish installer and updater metadata
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

